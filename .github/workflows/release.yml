name: Build and publish plugin release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package (for example v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build installable plugin ZIP
        run: |
          cd plg_system_modulesnowhere
          zip -r "$GITHUB_WORKSPACE/plg_system_modulesnowhere.zip" .

      - name: Upload package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$GITHUB_WORKSPACE/plg_system_modulesnowhere.zip" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$GITHUB_WORKSPACE/plg_system_modulesnowhere.zip" \
              --title "Modules Nowhere Plugin $RELEASE_TAG" \
              --generate-notes
          fi
